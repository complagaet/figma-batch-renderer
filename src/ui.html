<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
      }
      h1 { margin: 0 0 6px; font-size: 18px; }
      p { margin: 0; line-height: 1.45; }
      .muted { color: var(--figma-color-text-secondary); }
      .stack { display: grid; gap: 14px; }
      .card {
        padding: 14px;
        border: 1px solid var(--figma-color-border);
        border-radius: 10px;
        background: var(--figma-color-bg-secondary);
      }
      .status {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .dot {
        width: 8px;
        height: 8px;
        margin-top: 5px;
        border-radius: 50%;
        flex: none;
        background: var(--figma-color-icon-tertiary);
      }
      .status.valid .dot { background: #14ae5c; }
      .status.invalid .dot { background: #f24822; }
      .dropzone {
        display: grid;
        place-items: center;
        min-height: 120px;
        padding: 18px;
        border: 1.5px dashed var(--figma-color-border-strong);
        border-radius: 10px;
        text-align: center;
        cursor: pointer;
      }
      .dropzone.drag { border-color: #0d99ff; background: rgba(13, 153, 255, 0.08); }
      input[type="file"] { display: none; }
      button {
        width: 100%;
        padding: 10px 14px;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        color: white;
        background: #0d99ff;
        cursor: pointer;
      }
      button:disabled { cursor: not-allowed; opacity: 0.45; }
      button.secondary {
        width: auto;
        padding: 7px 10px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg-tertiary);
        border: 1px solid var(--figma-color-border);
      }
      .message { min-height: 20px; }
      .message.error { color: #f24822; }
      .message.success { color: #14ae5c; }
      .progress-wrap {
        display: grid;
        gap: 5px;
      }
      .progress-wrap[hidden] { display: none; }
      progress {
        width: 100%;
        height: 8px;
        accent-color: #0d99ff;
      }
      .progress-label {
        min-height: 16px;
        font-size: 11px;
        color: var(--figma-color-text-secondary);
      }
      .preview-wrap {
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--figma-color-border);
        border-radius: 8px;
      }
      table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 11px; }
      th, td { padding: 7px 9px; border-bottom: 1px solid var(--figma-color-border); text-align: left; }
      th { position: sticky; top: 0; background: var(--figma-color-bg-secondary); }
      code { font-family: ui-monospace, monospace; font-size: 11px; }
      .mapping-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .mapping-heading strong { display: block; margin-bottom: 3px; }
      .mapping-list {
        display: grid;
        gap: 8px;
        max-height: 250px;
        overflow: auto;
      }
      .mapping-row {
        display: grid;
        grid-template-columns: minmax(110px, 1fr) 18px minmax(170px, 1.4fr);
        gap: 7px;
        align-items: center;
      }
      .mapping-field {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mapping-arrow {
        color: var(--figma-color-text-tertiary);
        text-align: center;
      }
      select {
        width: 100%;
        min-width: 0;
        padding: 7px 28px 7px 8px;
        border: 1px solid var(--figma-color-border);
        border-radius: 7px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        font: inherit;
      }
      input[type="text"] {
        width: 100%;
        min-width: 0;
        padding: 7px 8px;
        border: 1px solid var(--figma-color-border);
        border-radius: 7px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        font: inherit;
      }
      .row-filter {
        display: grid;
        grid-template-columns: minmax(130px, auto) minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--figma-color-border);
      }
      .controls {
        display: grid;
        gap: 10px;
      }
      .controls.disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .controls.disabled * {
        cursor: not-allowed;
      }
      .control-row {
        display: grid;
        grid-template-columns: minmax(130px, auto) minmax(0, 1fr);
        gap: 10px;
        align-items: center;
      }
      .batch-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
      }
      .export-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
      }
      .filename-affixes {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <main class="stack">
      <div>
        <h1>Batch Template Renderer</h1>
        <p class="muted">One spreadsheet row fills one item slot. For repeated layouts use <code>slot_0</code>, <code>card_0</code>, <code>item_0</code>, etc.; if none exist, the selected frame is used as one slot.</p>
      </div>

      <div id="template-status" class="card status invalid">
        <span class="dot"></span>
        <p id="template-message">Select a template frame.</p>
      </div>

      <label id="dropzone" class="dropzone">
        <input id="file-input" type="file" accept=".csv,.xlsx" />
        <span><strong>Choose or drop a CSV/XLSX file</strong><br /><span class="muted">For XLSX files, choose the worksheet after loading.</span></span>
      </label>

      <section id="sheet-controls" class="card controls" hidden>
        <label class="control-row">
          <span><strong>Worksheet</strong><br /><span class="muted">Use when the workbook has multiple sheets.</span></span>
          <select id="sheet-select"></select>
        </label>
      </section>

      <section id="batch-controls" class="card controls" hidden>
        <label class="control-row">
          <span><strong>Generate batch</strong><br /><span class="muted">Limit each run to avoid memory pressure.</span></span>
          <span class="batch-grid">
            <select id="batch-size">
              <option value="100">100 rows</option>
              <option value="150">150 rows</option>
              <option value="200">200 rows</option>
              <option value="all">All rows</option>
            </select>
            <select id="batch-number"></select>
          </span>
        </label>
      </section>

      <section id="export-controls" class="card controls" hidden>
        <label class="control-row">
          <span><strong>Export mode</strong><br /><span class="muted">Individual files require exactly one item slot.</span></span>
          <span class="export-grid">
            <select id="export-mode">
              <option value="combined-pdf">One combined PDF</option>
              <option value="individual-pdfs">ZIP with one PDF per frame</option>
            </select>
            <select id="filename-column" hidden></select>
            <span id="filename-affixes" class="filename-affixes" hidden>
              <input id="filename-prefix" type="text" placeholder="Prefix, e.g. abc_" />
              <input id="filename-suffix" type="text" placeholder="Suffix" />
            </span>
          </span>
        </label>
      </section>

      <div id="file-summary" class="muted">No spreadsheet loaded.</div>
      <div id="preview" class="preview-wrap" hidden></div>

      <section id="mapping-card" class="card" hidden>
        <div class="mapping-heading">
          <div>
            <strong>Field mapping</strong>
            <p id="mapping-summary" class="muted">Match template fields to spreadsheet columns.</p>
          </div>
          <button id="auto-match" class="secondary" type="button">Auto-match</button>
        </div>
        <label class="row-filter">
          <span><strong>Skip row when empty</strong><br /><span class="muted">Rows skipped here do not occupy an item slot.</span></span>
          <select id="skip-row-column">
            <option value="">Do not skip rows</option>
          </select>
        </label>
        <div id="mapping-list" class="mapping-list"></div>
      </section>

      <p id="message" class="message muted"></p>
      <div id="progress-wrap" class="progress-wrap" hidden>
        <progress id="progress-bar" value="0" max="1"></progress>
        <div id="progress-label" class="progress-label"></div>
      </div>
      <button id="generate" disabled>Generate selected batch and PDF</button>
    </main>
    <script>/*__UI_BUNDLE__*/</script>
  </body>
</html>
